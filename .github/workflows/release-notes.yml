name: Update HAIBOX release notes

on:
  push:
    branches:
      - main
    paths:
      - releases/*.md

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Update notes for the current release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # New releases receive their notes in the release workflow.
          if git diff --name-only HEAD^ HEAD | grep -Fxq ".github/release-request.json"; then exit 0; fi
          version="$(jq -er '.version' .github/release-request.json)"
          notes="releases/v${version}.md"
          tag="v${version}"

          [[ -f "${notes}" ]] || exit 1
          git diff --name-only HEAD^ HEAD | grep -Fxq "${notes}" || exit 0
          gh release view "${tag}" >/dev/null
          gh release edit "${tag}" --notes-file "${notes}"
