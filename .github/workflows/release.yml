name: Publish approved HAIBOX release

on:
  push:
    branches:
      - main
    paths:
      - .github/release-request.json

permissions:
  contents: write

concurrency:
  group: haibox-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release request and source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          REQUEST=".github/release-request.json"
          VERSION="$(jq -er '.version' "${REQUEST}")"
          TITLE="$(jq -er '.title' "${REQUEST}")"
          NOTES_FILE="$(jq -er '.notes_file' "${REQUEST}")"
          REPAIR="$(jq -r '.repair_existing // false' "${REQUEST}")"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+([.][0-9]+)?$ ]]; then
            echo "Invalid release version: ${VERSION}" >&2
            exit 1
          fi

          TAG="v${VERSION}"
          ASSET="haibox-wireguard_v${VERSION}.sh"
          CHECKSUM="${ASSET}.sha256"

          [[ -f haibox-wireguard.sh ]] || { echo "Missing haibox-wireguard.sh" >&2; exit 1; }
          [[ -f "${NOTES_FILE}" ]] || { echo "Missing release notes: ${NOTES_FILE}" >&2; exit 1; }
          bash -n haibox-wireguard.sh
          grep -Fqx "# Version ${VERSION}" haibox-wireguard.sh || {
            echo "Script header does not match release version ${VERSION}." >&2
            exit 1
          }

          if [[ "${REPAIR}" == true ]]; then
            [[ "${VERSION}" == "6.6" ]] || { echo "Repair is restricted to v6.6." >&2; exit 1; }
            EXPECTED_TAG="$(jq -er '.expected_tag_sha' "${REQUEST}")"
            EXPECTED_ASSET="$(jq -er '.expected_asset_sha256' "${REQUEST}")"
            [[ "$(git rev-parse "refs/tags/${TAG}")" == "${EXPECTED_TAG}" ]] || {
              echo "Existing tag changed; refusing repair." >&2; exit 1;
            }
            gh release view "${TAG}" >/dev/null
            mkdir -p "${RUNNER_TEMP}/previous-release"
            gh release download "${TAG}" -p "${ASSET}" -D "${RUNNER_TEMP}/previous-release"
            [[ "$(sha256sum "${RUNNER_TEMP}/previous-release/${ASSET}" | cut -d' ' -f1)" == "${EXPECTED_ASSET}" ]] || {
              echo "Existing asset changed; refusing repair." >&2; exit 1;
            }
          elif git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; refusing to overwrite it." >&2
            exit 1
          fi

          install -m 700 haibox-wireguard.sh "${ASSET}"
          sha256sum "${ASSET}" > "${CHECKSUM}"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "title=${TITLE}" >> "${GITHUB_OUTPUT}"
          echo "notes_file=${NOTES_FILE}" >> "${GITHUB_OUTPUT}"
          echo "asset=${ASSET}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${CHECKSUM}" >> "${GITHUB_OUTPUT}"
          echo "repair=${REPAIR}" >> "${GITHUB_OUTPUT}"

      - name: Create tag, GitHub Release, script, and checksum
        if: steps.release.outputs.repair != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
          ASSET: ${{ steps.release.outputs.asset }}
          CHECKSUM: ${{ steps.release.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${TAG}" "${ASSET}" "${CHECKSUM}" \
            --target "${GITHUB_SHA}" \
            --title "${TITLE}" \
            --notes-file "${NOTES_FILE}"

      - name: Replace corrected v6.6 assets and move tag
        if: steps.release.outputs.repair == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
          CHECKSUM: ${{ steps.release.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${TAG}" "${ASSET}" "${CHECKSUM}" --clobber
          mkdir -p "${RUNNER_TEMP}/verified-release"
          gh release download "${TAG}" -p "${ASSET}" -p "${CHECKSUM}" -D "${RUNNER_TEMP}/verified-release"
          cmp "${ASSET}" "${RUNNER_TEMP}/verified-release/${ASSET}"
          cmp "${CHECKSUM}" "${RUNNER_TEMP}/verified-release/${CHECKSUM}"
          (cd "${RUNNER_TEMP}/verified-release" && sha256sum -c "${CHECKSUM}")
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
            -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          [[ "$(git ls-remote origin "refs/tags/${TAG}" | cut -f1)" == "${GITHUB_SHA}" ]]
